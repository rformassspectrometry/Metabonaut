## Check here for sequential workflow configuration
## https://www.r-bloggers.com/2020/07/running-github-actions-sequentially/
name: docker

on:
  push:
    branches:
    - main
    paths-ignore:
      - 'README.md'

jobs:
  build-docker-and-push:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          ## Avoids the anonymous GitHub API rate limit during the build.
          secrets: |
            github_pat=${{ secrets.GITHUB_TOKEN }}
          tags: |
            rformassspectrometry/metabonaut:latest
            rformassspectrometry/metabonaut:RELEASE_3_23
      -
        name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Trigger next workflow
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_GHA_PAT }}
          repository: ${{ github.repository }}
          event-type: trigger-workflow-2
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
